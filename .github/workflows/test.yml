name: Test

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # EE-30: the Android 17 SDK packages are published with a minor version
      # (`platforms;android-37.0`, `system-images;android-37.0;google_apis;x86_64`); android-emulator-runner
      # >= v2.34.0 accepts such api-level strings (v2.33.0 only accepted integers and looked for android-37).
      target_api_level: "37.0"
      profile: medium_phone

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # disk size is part of the key: a cached AVD keeps its userdata image, so changing disk-size must
          # create a fresh AVD
          key: avd-${{ env.target_api_level }}-${{ env.profile }}-6144M

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.target_api_level }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.profile }}
          force-avd-creation: false
          # EE-30: the API 37 image's default userdata partition is too small for the app + test APKs
          # ("Requested internal only, but not enough space" on the first API 37 CI run)
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run Android tests, unit tests and monkey test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.target_api_level }}
          profile: ${{ env.profile }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disk-size: 6144M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: |
            adb shell settings put global auto_time 0
            adb shell su 0 date 01012100
            ./gradlew packageDebug
            adb shell input keyevent 3
            adb shell settings put secure long_press_timeout 1500
            adb uninstall com.futsch1.medtimer || true
            EXIT_CODE=0 && ./gradlew JacocoDebugCodeCoverage || EXIT_CODE=$? && (adb pull /sdcard/googletest/test_outputfiles app/build/outputs/androidTest-results/ || true) && exit $EXIT_CODE
            adb install -g app/build/outputs/apk/debug/MedTimer-debug.apk
            adb shell monkey -p com.futsch1.medtimer -v 5000 --throttle 10
          cores: 4

      - name: Run fuzzing tests
        run: ./gradlew testDebug -Dfuzzing=true
      - name: Android lint
        run: ./gradlew lint

      # EE-30: the org.sonarqube Gradle plugin is disabled on this branch (incompatible with the AGP 9 variant
      # API, see app/build.gradle.kts), so the `sonar` task does not exist. Re-enable this step together with
      # the plugin.
      # - name: SonarQube
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   if: ${{ env.SONAR_TOKEN != '' }}
      #   run: ./gradlew sonar

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: TestReports
          path: |
            app/build/reports/jacoco/JacocoDebugCodeCoverage/html
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/androidTest/connected/debug
            app/build/reports/lint-results-debug.html
            app/build/outputs/androidTest-results
